<text x="119" y="777" fill="#ffd681" font-size="24" font-weight="bold" font-family="DejaVu Sans">DİKKAT: OLED'i 3.3 V ile besle, 5 V hattına bağlama.</text>
<text x="119" y="814" fill="#dee5ef" font-size="21" font-family="DejaVu Sans">Pinlerin fiziksel sırası karta göre değişir. D1/D2/3V3/GND ve OLED üzerindeki yazıları esas al.</text>
<text x="119" y="841" fill="#bbc8d5" font-size="17" font-family="DejaVu Sans">Bu şema elektriksel bağlantıyı gösterir; üreticiye göre pinlerin kart üzerindeki konumu değişebilir.</text>
